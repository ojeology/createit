<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CREATEIT — Create It. Recreate It. Beat It.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Splash screen -->
  <div id="splash">
    <div class="sp-aura"></div>
    <div class="sp-logo">
      <svg width="96" height="96" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <text x="50" y="50" font-family="var(--display)" font-size="42" dominant-baseline="middle"
          text-anchor="middle" class="sp-l pink">CREATE</text>
        <text x="50" y="72" font-family="var(--display)" font-size="42" dominant-baseline="middle"
          text-anchor="middle" class="sp-l blue">IT</text>
      </svg>
    </div>
    <div class="sp-word">
      <span class="sp-b1">CREATE</span>
      <span class="sp-b2 pink">IT</span>
    </div>
    <div class="sp-steps">
      <div class="sp-step s1">CREATE</div>
      <div class="sp-step s2">RECREATE</div>
      <div class="sp-step s3">BEAT IT</div>
    </div>
    <p class="sp-skip">Skip</p>
  </div>

  <!-- Top bar -->
  <header id="topbar">
    <div class="brand">
      <svg class="logo-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <text x="50" y="50" font-family="var(--display)" font-size="35" dominant-baseline="middle"
          text-anchor="middle" class="pink">IT</text>
      </svg>
      <div class="wordmark">
        <span class="pink">CREATE</span>IT
      </div>
    </div>
    <div class="tb-spacer"></div>
    <div>
      <button class="icon-btn" aria-label="Notifications">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 14l2-2l8 8"></path>
        </svg>
        <span class="dot-badge">3</span>
      </button>
      <button class="icon-btn" aria-label="Profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
    </div>
  </header>

  <main id="app">
    <!-- TikTok‑style For You feed -->
    <section class="fy-feed">
      <div class="fy-track" id="fy-track">
        <!-- Cards will be injected by JS; placeholder -->
        <article class="fy-card">
          <div class="fy-media">
            <video playsinline autoplay muted>
              <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/Sample Videos/BigBuckBunny.mp4" type="video/mp4">
            </video>
          </div>
          <div class="fy-actions">
            <button class="fy-like"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2l-11.5 7.5L5 20l6.9-4.6L2 22l10-6z"/></svg></button>
            <span class="fy-count">0</span>
            <button class="fy-share"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L12 14.76l-5.43 2.29a2 2 0 0 1-2.83-2.83l7.17-7.17a2 2 0 0 1 2.83 0z"/></svg></button>
          </div>
          <div class="fy-info">
            <div class="fy-creator">CreatorName</div>
            <div class="fy-desc">Challenge #001: master the beat</div>
          </div>
        </article>
        <!-- repeat as needed -->
      </div>
    </section>

    <!-- Stage pills (CREATE → RECREATE → BEAT IT) -->
    <div class="stage-pills">
      <span class="pill pink" data-stage="create">CREATE</span>
      <span class="pill blue" data-stage="recreate">RECREATE</span>
      <span class="pill purple" data-stage="beat">BEAT IT</span>
    </div>

    <!-- Hero / featured challenge (optional) -->
    <section class="hero-section">
      <div class="hero-media">
        <video playsinline autoplay muted>
          <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/Sample Videos/BigBuckBunny.mp4" type="video/mp4">
        </video>
      </div>
      <div class="hero-body">
        <div class="hero-code">#001</div>
        <h1 class="hero-title">Master the Beat</h1>
        <p class="hero-meta">
          <b>Posted:</b> 2 days ago •
          <b>Views:</b> 12.4k
        </p>
        <div class="hero-cta">
          <button class="btn pink">Attempt</button>
          <button class="btn blue">Watch</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom navigation (TikTok style) -->
  <nav id="bottomnav">
    <button class="bn-item active">
      <span class="ico">🏠</span>
      <span>Home</span>
    </button>
    <button class="bn-item">
      <span class="ico">➕</span>
      <span>Create</span>
    </button>
    <button class="bn-create pink">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Attempt
    </button>
    <button class="bn-item">
      <span class="ico">👁️</span>
      <span>Explore</span>
    </button>
    <button class="bn-item">
      <span class="ico">👤</span>
      <span>Profile</span>
    </button>
  </nav>

  <script>
    // Simple splash hide
    document.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash');
      if (splash) {
        setTimeout(() => splash.classList.add('sp-out'), 3500);
        setTimeout(() => splash.style.display = 'none', 3900);
      }
    });

    // Tiny swipe‑able feed (basic, no external libs)
    (() => {
      const track = document.getElementById('fy-track');
      if (!track) return;
      let startX = 0;
      let isDown = false;
      const cards = track.querySelectorAll('.fy-card');
      const cardWidth = cards[0]?.offsetWidth || 360;

      track.addEventListener('pointerdown', (e) => {
        isDown = true;
        startX = e.clientX - track.offsetLeft;
        track.style.cursor = 'grabbing';
      });
      track.addEventListener('pointerup', () => {
        isDown = false;
        track.style.cursor = 'grab';
      });
      track.addEventListener('pointermove', (e) => {
        if (!isDown) return;
        const x = e.clientX - track.offsetLeft;
        const walk = (x - startX) * 0.8; // smooth factor
        track.scrollLeft = Math.max(0, track.scrollLeft - walk);
      });
      // auto‑scroll marquee effect (optional)
      let direction = 1;
      setInterval(() => {
        track.scrollLeft += direction * 2;
        if (track.scrollLeft + track.clientWidth >= track.scrollWidth) direction = -1;
        if (track.scrollLeft <= 0) direction = 1;
      }, 3000);
    })();
  </script>
</body>
</html>
